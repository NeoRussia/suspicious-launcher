# USAGE
# dimension.<Shader to use> = <dimension(s) that use this shader. use " * " for fallback>
# "shader to use" refers to shaderpacks/EXAMPLESHADER/shaders/<name "Shader to use" >..., like how optifine has world0, world1, but you can name these anything here.
# the dimension "ID's" to use are equivalent to the "ID's" from the /execute in <dimension> command in-game.

# EXAMPLE
# dimension.world0 = minecraft:overworld twilightforest:twilight_forest
# dimension.world-1 = minecraft:the_nether 
# dimension.WHATEVER = somemod:whateverdimension

dimension.world0 = minecraft:overworld *
dimension.world-1 = minecraft:the_nether 
dimension.world1 = minecraft:the_end 
dimension.worldx = 

# this is using alternate versions of the overworld shader, that have tweaks targeted at specific dimensions
dimension.world0_with_aether_flag = aether:the_aether
dimension.world0_with_twilight_forest_flag = twilightforest:twilight_forest
# SUSY planets and orbits. SuSyDimensions registers two types: "Supersymmetry Planet"
# (WorldProviderPlanet, dimension 800+) and "susy_space" (WorldProviderSpace, e.g. 802
# low_earth_orbit). Demonica keys this map on the dimension type name exactly as it comes back from
# DimensionId.canonicalize: vanilla names are lowercased, modded names are kept as-is, so the value
# must match case. Quotes are only needed for the names with spaces. Both types get the same airless
# set here; split them into their own folders when orbits need a different sky.
dimension.DIM800 = "Supersymmetry Planet"
dimension.DIM802 = susy_space

# Dimension 10, 'The Beneath': an enclosed underground dimension. The nether program set is the
# closest base because everything that draws sky (sun, moon, stars, skybox, clouds) sits under
# OVERWORLD_SHADER, so the nether path leaves Background black at no cost. UNDERGROUND_DIM in
# settings.glsl then forces the cave fog on and thickens the haze. The Beneath reports a black fog
# colour from WorldProviderDeepDank.getFogColor, which the nether haze normalizes into neutral grey.
dimension.DIM10 = "The Beneath"

# Dimension 3, the pack's outer-space dimension. Its DimensionType name canonicalizes to "space"
# (Demonica logs "Creating pipeline for dimension 'space'"), so that is the key. Same treatment as
# the planets: the airless set from DIM800, which is world0 plus PLANET_MOON - no clouds, no pack
# moon, RESOURCEPACK_SKY 2 so the dimension's own skybox shows, shader stars over it.
dimension.DIM3 = space
